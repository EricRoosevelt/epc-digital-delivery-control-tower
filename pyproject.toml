[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-digital-delivery-control-tower"
version = "1.0.0"
description = "Turn IFC model data and project-authored information requirements into traceable digital-delivery findings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Eric" }]
keywords = ["ifc", "openbim", "ids", "bcf", "buildingsmart", "epc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Kept byte-for-byte in step with requirements.txt. `python -m pip check`
# is a CI gate, so the two must never drift.
dependencies = [
    "ifcopenshell==0.8.5",
    "ifctester==0.8.5",
    "pandas==3.0.5",
    "xmlschema==4.3.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.5"]

[project.scripts]
epc-ct = "epc_control_tower.cli:main"

[tool.setuptools]
# Explicit: `src/` holds the legacy shim scripts and must not be packaged,
# and `tests/` is not a package at all.
packages = [
    "epc_control_tower",
    "epc_control_tower.bcf",
    "epc_control_tower.checkers",
    "epc_control_tower.exporters",
    "epc_control_tower.grouping",
    "epc_control_tower.stages",
]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
# Pyflakes and pycodestyle. Deliberately not the wider rule set: the three
# validators under src/ are Phase 5 work and have not been touched, so turning
# on import sorting or syntax modernisation would mean rewriting files this
# phase promised to leave alone.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Not yet refactored, and not this phase's business. The line-length rule is
# suspended for them rather than the limit being raised for everybody, so the
# exemption is visible and finite.
"src/validate_bcf.py" = ["E501"]
"src/validate_dashboard.py" = ["E501"]
"src/validate_pbip.py" = ["E501"]
"tests/test_validate_pbip.py" = ["E501"]

[tool.pytest.ini_options]
# The existing suite imports `from src.validate_pbip import ...` with no
# conftest.py and no src/__init__.py, so the repository root must be on
# sys.path. `python -m pytest` did this implicitly; state it explicitly now
# that a rootdir config file exists.
pythonpath = ["."]
testpaths = ["tests"]
