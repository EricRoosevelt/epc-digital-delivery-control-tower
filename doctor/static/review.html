<title>BIM Doctor · 3D review</title>

<style>
#startup-error { margin: 16px; padding: 16px; border: 1px solid var(--line, #dbe3e9); background: var(--surface, #fff); color: var(--ink, #172b3a); font: 16px/1.6 "Segoe UI", sans-serif; }
#startup-error button { padding: 8px 14px; font: inherit; cursor: pointer; }
#startup-error .startup-failure { display: none; }
html[data-startup-state="failed"] #startup-error .startup-loading { display: none; }
html[data-startup-state="failed"] #startup-error .startup-failure { display: block; }
html[data-startup-state="ready"] #startup-error { display: none; }
</style>
</head>
<body class="review-app">
<section id="startup-error" role="alert" aria-live="polite">
<p class="startup-loading">正在载入应用 / Loading application…</p>
<p class="startup-failure">应用资源未载入。请重试载入此页面。 / Application resources could not be loaded. Retry loading this page.</p>
<button type="button" onclick="location.reload()">重试载入 / Retry loading</button>
</section>

<div id="review-root"></div>
