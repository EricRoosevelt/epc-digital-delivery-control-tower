# Run configuration. Deliberately small: constants that describe a project
# belong in that project's manifest, constants that describe a rule belong on
# the rule, and constants that merely record what a fixture contains belong in
# tests. What is left is a handful of genuine runtime knobs.

[run]
# The rule library. A directory of declarative rules, one TOML file per rule;
# the IDS document under ids/ is compiled from it by every run.
ruleset_path = "rules/epc-delivery"

# Which project the legacy writers publish.
#
# The eight CSV files under data/processed/ and the BCF archive under reports/
# describe the PCERT sample project alone. That is a property of the frozen
# contract: the tracked Power BI project asserts three models and thirty-nine
# elements, and the committed acceptance evidence was captured against those
# numbers. Adding a second project must not change any of it, so the legacy
# writers are told which project they are for. This setting retires together
# with the legacy adapters in Phase 5.
legacy_project_id = "pcert-sample"

# The frozen rule document those files were built from.
#
# The published files mean "what rule set 0.1 said about the PCERT project".
# Both halves are scope. Without this pin, adding a single rule to the current
# document destroys all forty-seven published finding keys — measured, not
# assumed — because the published run_id is a digest of the document's bytes.
# That would in turn invalidate docs/evidence/stage_3b/acceptance_manifest.json,
# which can only be regenerated by re-capturing screenshots by hand, so the rule
# library could not grow until Phase 5. New rules go into a new version of the
# document and reach the canonical outputs only.
legacy_ruleset_path = "ids/epc_delivery_requirements_v0.1.ids"

# The frozen metadata the legacy topics are built from, keyed by requirement,
# and the SHA-256 that pins its bytes.
#
# The published archive's priority, stage, labels and assignee once came from
# the current rules, which meant editing a live rule moved a frozen published
# byte. They come from this document now — validated to freeze exactly rule set
# 0.1's requirements — so the two are severed. Retires with the adapters.
legacy_compat_path = "docs/contracts/legacy/legacy_bcf_compat.v0.1.json"
legacy_compat_sha256 = "be8a28b8222baa53fb76dcf716a5e5141b0cbd9e8622be25ef2d50092900402f"
