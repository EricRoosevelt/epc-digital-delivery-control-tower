# The EPC delivery rule set.
#
# One file per rule, so a rule is reviewed as a rule rather than as a diff
# against a Python module. Everything the pipeline needs about a rule is in its
# file: what it applies to, what it requires, how badly it matters, who owns
# it, when it applies, and what it cites.
#
# The IDS document under ids/ is compiled from these files. It is a build
# product — regenerated by every run and covered by the same diff gate as the
# CSVs — not a source. Edit the rules here, never that document.

[ruleset]
ruleset_id = "epc-delivery"

# A (ruleset_id, version) pair names exactly one set of rules, and `epc-ct
# snapshot --refresh` refuses if it ever names two.
#
# Raise the major part when this rule set can reject something it used to
# accept — a rule added, or an existing one tightened — because a model that
# passed before can fail now. Raise the minor part for anything else that moves
# the normalized digest: wording, ownership metadata, a rule removed or
# relaxed. Only the first half is machine-checkable; which half moved is a
# judgement, and it is written down here so it is at least a judgement made
# against a stated rule.
#
# 2.0 because 1.0 said "seven rules" and then went on saying it while the rules
# became twelve. See the CHANGELOG entry for contract 1.4.
version = "2.0"
title = "EPC Digital Delivery Requirements"
description = "Project-authored information requirements for the EPC Digital Delivery Control Tower prototype."
purpose = "Validate selected information requirements in public multidisciplinary IFC sample models."
milestone = "Portfolio prototype"
